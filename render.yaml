# Free Render Postgres databases expire after 30 days. Upgrade the database
# plan in Render before using FitBuddy for ongoing data collection.
services:
  - type: web
    name: fitbuddy
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitbuddy-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: coach
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: GEMINI_PLAN_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIP_MODEL
        value: gemini-3.8-flash

databases:
  - name: fitbuddy-db
    databaseName: fitbuddy
    user: fitbuddy
    region: oregon
    plan: free
